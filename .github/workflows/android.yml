name: Android CI & Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Brainfuck toolchain, generated-file staleness, randomized program tests,
  # Java-vs-Brainfuck parity and robustness tests. No secrets.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew scripts/check-project.sh

      - name: Validate project files
        run: ./scripts/check-project.sh

      - name: Generated Brainfuck output is up to date
        run: python3 tools/bftool/gen.py --check

      - name: Brainfuck toolchain and program tests (reference vs IR vs AOT, randomized, malformed frames)
        run: python3 -m unittest discover -s tests/compiler -v

      - name: Unit, parity and robustness tests (host build of libtwitterbf)
        run: ./gradlew testDebugUnitTest -PparityCases=40000

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # NDK build of the APK and a structural check of what it ships. No secrets.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Verify APK structure and native libraries
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          apk = glob.glob("app/build/outputs/apk/release/*.apk")[0]
          names = set(zipfile.ZipFile(apk).namelist())
          required = ["META-INF/xposed/java_init.list", "META-INF/xposed/module.prop",
                      "META-INF/xposed/scope.list", "classes.dex"]
          for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
              required += ["lib/%s/libtwitterbf.so" % abi, "lib/%s/libdexkit.so" % abi]
          missing = [n for n in required if n not in names]
          assert not missing, missing
          print(apk, "ships", len(required), "required entries")
          EOF

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

  # Signing credentials exist only in this job, only for tags and releases.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
